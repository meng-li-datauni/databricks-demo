# Lakeflow Job (Workflow): a DAG of tasks on serverless compute.
#
#   setup -> generate_data -> bronze -> silver -> gold -> delta_features
#                  |                                  \-> train_model
#                  \-> orders_pipeline (Lakeflow Declarative Pipeline)

resources:
  jobs:
    lakehouse_etl:
      name: databricks_demo_lakehouse_etl
      description: Medallion ETL, Delta Lake tour, and MLflow training on synthetic e-commerce data.

      # Job parameters can be overridden per run:
      #   databricks bundle run lakehouse_etl --params batch=1
      parameters:
        - name: batch
          default: "0"

      # Runs daily in prod; development mode pauses it automatically.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: databricks_demo
            entry_point: setup
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: generate_data
          depends_on:
            - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: databricks_demo
            entry_point: generate
            # {{job.parameters.batch}} is a dynamic value reference resolved at run time.
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}", --batch, "{{job.parameters.batch}}"]

        - task_key: bronze
          depends_on:
            - task_key: generate_data
          environment_key: default
          # Auto Loader stops once when it sees a new column, then resumes with it.
          max_retries: 1
          min_retry_interval_millis: 10000
          python_wheel_task:
            package_name: databricks_demo
            entry_point: bronze
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          # Streaming from a Delta table also restarts once after a schema change.
          max_retries: 1
          min_retry_interval_millis: 10000
          python_wheel_task:
            package_name: databricks_demo
            entry_point: silver
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          python_wheel_task:
            package_name: databricks_demo
            entry_point: gold
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: delta_features
          depends_on:
            - task_key: gold
          environment_key: default
          python_wheel_task:
            package_name: databricks_demo
            entry_point: delta_features
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: train_model
          depends_on:
            - task_key: gold
          environment_key: ml
          python_wheel_task:
            package_name: databricks_demo
            entry_point: train
            parameters: [--catalog, "${var.catalog}", --schema, "${var.schema}"]

        - task_key: orders_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_pipeline.id}

      # Serverless environments: the wheel built by the bundle, plus extra libraries.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
              - mlflow>=3.16
              - scikit-learn>=1.4
