# Databricks Asset Bundle: infrastructure-as-code for jobs, pipelines and code.
#
#   databricks bundle validate            # check config
#   databricks bundle deploy  -t dev      # build the wheel, upload, create/update resources
#   databricks bundle run lakehouse_etl   # run the job
#   databricks bundle destroy -t dev      # tear everything down
bundle:
  name: databricks_demo

include:
  - resources/*.yml

# Build src/ into a wheel on every deploy; jobs install it via ../dist/*.whl.
artifacts:
  python_artifact:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog that holds the demo schema
    default: main
  schema:
    description: Schema for the demo tables (a <schema>_dlt schema is created for the pipeline)
    default: databricks_demo

targets:
  dev:
    # Development mode: resources are prefixed "[dev <user>]", schedules are
    # paused, and every developer deploys their own isolated copy.
    mode: development
    default: true
    variables:
      schema: ${workspace.current_user.short_name}_databricks_demo
    # workspace:
    #   host: https://<your-workspace>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      # host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: databricks_demo
